<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Whimsy & Weave</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <!-- BACKGROUND -->

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="grain"></div>

    <!-- MAIN -->

    <main class="auth-layout">

        <!-- LEFT -->

        <section class="showcase">

            <div class="floating-yarn yarn-1"></div>
            <div class="floating-yarn yarn-2"></div>

            <div class="floating-heart"></div>

            <div class="showcase-content fade-up">

                <p class="eyebrow">
                    WHIMSY & WEAVE
                </p>

                <h1>
                    Welcome Back
                    To The Cozy
                    Crochet World ✨
                </h1>

                <p>
                    Sign in to continue your handmade journey with
                    Whimsy & Weave.
                </p>

            </div>

        </section>

        <!-- RIGHT -->

        <section class="auth-side">

            <div class="auth-card fade-up">

                <!-- TABS -->

               

                <!-- LOGIN -->

                <form class="form active" id="loginForm">

                    <div class="input-group">

                        <input type="email" id="loginEmail" required placeholder="Email">

                        <label for="loginEmail">Email</label>

                    </div>

                    <div class="input-group password-group">

                        <input type="password" id="loginPassword" required placeholder="Password">

                        <label for="loginPassword">Password</label>

                        <button type="button" class="toggle-password" aria-label="Show password">
                            👁
                        </button>

                    </div>


                    <div class="form-options">

                        <label class="checkbox">

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <button type="button" class="forgot-btn">
                            Forgot Password?
                        </button>

                    </div>

                    <button type="submit" class="main-btn">
                        Login
                    </button>

                    <div class="divider">
                        OR
                    </div>

                    <button type="button" class="social-btn" data-provider="Google">
                        Continue with Google
                    </button>

                    <button type="button" class="social-btn instagram" data-provider="Instagram">
                        Continue with Instagram
                    </button>

                </form>

<p class="switch-text">
    New here?
    <a href="signup.html">Create an account</a>
</p>

            </div>
        </section>


    </main>


       
    <!-- MODAL -->

    <div class="modal" id="forgotModal">

        <div class="modal-card">

            <button class="close-modal">
                ✕
            </button>

            <h2>Reset Password</h2>

            <p>
                Enter your email to receive reset instructions.
            </p>

            <div class="input-group">

                <input type="email" id="resetEmail" required>

                <label>Email Address</label>

            </div>

            <button class="main-btn reset-btn">
                Send Reset Link
            </button>

        </div>

    </div>

    <!-- TOAST -->

    <div class="toast" id="toast"></div>

    <script src="js/login.js"></script>

</body>

</html>
